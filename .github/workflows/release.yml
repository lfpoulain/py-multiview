# Every push and pull request: lint, test and build the Windows app.
# Every push to main: also publish it as a GitHub release (version major.minor.<run number>).
name: Build & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Compute version
        id: version
        # Major.minor come from py_multiview/__init__.py, the patch is the build number.
        run: |
          $base = python -c "import py_multiview as m; print('.'.join(m.__version__.split('.')[:2]))"
          "version=$base.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Cache standard FFmpeg
        uses: actions/cache@v4
        with:
          path: bin/standard
          key: ffmpeg-standard-${{ hashFiles('scripts/ffmpeg-standard.json') }}

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: ./scripts/build.ps1 -Python python -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: py-multiview-${{ steps.version.outputs.version }}
          path: |
            dist/py-multiview-setup.exe
            dist/py-multiview-portable.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: py-multiview-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          latest="https://github.com/${GH_REPO}/releases/latest/download"
          cat > notes.md <<NOTES
          ## Télécharger

          - Installeur : [py-multiview-setup.exe](${latest}/py-multiview-setup.exe)
          - Portable : [py-multiview-portable.zip](${latest}/py-multiview-portable.zip) (dézipper puis lancer \`py-multiview.exe\`)

          Windows 10/11 64 bits, FFmpeg inclus. Si Windows SmartScreen s'affiche, choisir « Informations complémentaires » puis « Exécuter quand même ».
          NOTES
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "py-multiview ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --latest
